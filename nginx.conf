events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            autoindex on;
        }
        
        # Serve the output directory specifically
        location /output_dir/ {
            alias /usr/share/nginx/html/output_dir/;
            autoindex on;
        }
    }
}
